spring.application.name=order-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8082}
services.users.url=${USER_SERVICE_URL:http://localhost:8081}
services.users.password=${ORDER_SERVICE_INTERNAL_PASSWORD}
